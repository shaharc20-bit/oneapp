apiVersion: v1
kind: Pod
metadata:
  name: nginx-resolver
  labels:
    app: nginx-resolver
    exam: q14
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-resolver-service
  labels:
    exam: q14
spec:
  type: ClusterIP
  selector:
    app: nginx-resolver
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# Debug pod used to run nslookup against the Service and the Pod DNS names
apiVersion: v1
kind: Pod
metadata:
  name: dns-lookup-shahar
  labels:
    exam: q14
    role: dns-debug
spec:
  restartPolicy: Never
  containers:
    - name: busybox
      image: busybox:1.28
      command: ["sleep", "3600"]
