apiVersion: v1
kind: Pod
metadata:
  name: multi-pod
  labels:
    exam: q16
spec:
  containers:
    - name: alpha
      image: nginx
      env:
        - name: name
          value: alpha
      ports:
        - containerPort: 80
    - name: beta
      image: busybox
      command: ["sleep", "4800"]
      env:
        - name: name
          value: beta
