# Q12 — PV used by the use-pv pod. hostPath base is /data as requested.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-1
  labels:
    exam: q12
    type: local
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-1
  labels:
    exam: q12
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 100Mi
  volumeName: pv-1
