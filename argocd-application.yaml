apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oneapp
  namespace: argocd
spec:
  project: oneapp-project
  source:
    repoURL: https://github.com/shaharc20-bit/oneapp.git
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
