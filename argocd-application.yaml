apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oneapp
  namespace: argocd
spec:
  project: oneapp-project
  source:
    repoURL: https://github.com/shaharc20-bit/oneapp.git
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: oneapp-oneapp
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
