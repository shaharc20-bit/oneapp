apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: stress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --cpu
            - {{ .Values.stress.cpuWorkers | quote }}
            - --cpu-load
            - {{ .Values.stress.cpuLoad | quote }}
            {{- if gt (int .Values.stress.vmWorkers) 0 }}
            - --vm
            - {{ .Values.stress.vmWorkers | quote }}
            - --vm-bytes
            - {{ .Values.stress.vmBytes | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
