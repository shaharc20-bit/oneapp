replicaCount: 2

image:
  repository: shaharc20/flask-aws-monitor
  tag: latest
  pullPolicy: Always

containerPort: 5001

service:
  type: LoadBalancer
  port: 5001

ingress:
  enabled: false
  className: nginx
  host: flask-monitor.local
  path: /
  annotations: {}

env:
  AWS_REGION: eu-north-1

aws:
  accessKeyId: ""
  secretAccessKey: ""
  existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
