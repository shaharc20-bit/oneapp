{{- if and (not .Values.aws.existingSecret) .Values.aws.accessKeyId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flask-aws-monitor.fullname" . }}-aws
  labels:
    {{- include "flask-aws-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.secretAccessKey | quote }}
{{- end }}
