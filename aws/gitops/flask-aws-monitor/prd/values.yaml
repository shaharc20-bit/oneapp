replicaCount: 3

image:
  repository: shaharc20/flask-aws-monitor
  tag: "latest"
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 5001

ingress:
  enabled: true
  className: traefik
  host: flask-prd.13.60.156.99.nip.io
  path: /

aws:
  existingSecret: aws-credentials

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
