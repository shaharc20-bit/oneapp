trigger:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - aws/app
      - aws/cicd/azure-pipelines.yml

pr:
  branches:
    include:
      - main
      - dev

parameters:
  - name: selfHostedPool
    displayName: Run on the self-hosted agent pool (builder EC2)
    type: boolean
    default: false

pool:
  ${{ if eq(parameters.selfHostedPool, true) }}:
    name: Default
  ${{ else }}:
    vmImage: ubuntu-latest

variables:
  - group: dockerhub
  - name: appDir
    value: aws/app
  - name: imageRepo
    value: $(DOCKERHUB_USERNAME)/flask-aws-monitor
  - name: imageTag
    value: $(Build.BuildId)
  - name: pyRun
    value: docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -e PYTHONDONTWRITEBYTECODE=1 -v $(Build.SourcesDirectory):/src -w /src/aws/app python:3.12-slim

stages:
  - stage: Checks
    displayName: Lint & Security Scan
    jobs:
      - job: Lint
        displayName: Linting
        steps:
          - checkout: self
          - script: $(pyRun) sh -c "pip install --user -q flake8 && python -m flake8 ."
            displayName: flake8 (Python)
          - script: docker run --rm -i hadolint/hadolint < $(appDir)/Dockerfile
            displayName: hadolint (Dockerfile)
          - script: docker run --rm -v $(Build.SourcesDirectory):/src -w /src koalaman/shellcheck:stable $(find aws -name "*.sh")
            displayName: shellcheck (Shell)

      - job: SecurityScan
        displayName: Security Scan
        steps:
          - checkout: self
          - script: $(pyRun) sh -c "pip install --user -q bandit && python -m bandit -r . -x ./tests -ll"
            displayName: bandit (Python)
          - script: >
              docker run --rm -v $(Build.SourcesDirectory):/src aquasec/trivy:latest
              fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 /src/aws
            displayName: trivy fs (dependencies, secrets, misconfig)

      - job: UnitTests
        displayName: Unit Tests
        steps:
          - checkout: self
          - script: $(pyRun) sh -c "pip install --user -q -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider tests --junitxml=/src/test-results.xml"
            displayName: pytest
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFiles: $(Build.SourcesDirectory)/test-results.xml

  - stage: BuildPush
    displayName: Build & Push
    dependsOn: Checks
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildAndPush
        displayName: Docker build, scan, push
        steps:
          - checkout: self
          - task: Docker@2
            displayName: Login to Docker Hub
            inputs:
              command: login
              containerRegistry: dockerhub-connection
          - script: docker build -t $(imageRepo):$(imageTag) -t $(imageRepo):latest $(appDir)
            displayName: docker build
          - script: >
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 $(imageRepo):$(imageTag)
            displayName: trivy image
          - script: |
              docker push $(imageRepo):$(imageTag)
              docker push $(imageRepo):latest
            displayName: docker push
          - task: Docker@2
            displayName: Logout
            condition: always()
            inputs:
              command: logout
              containerRegistry: dockerhub-connection
