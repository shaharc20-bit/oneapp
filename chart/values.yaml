replicaCount: 2

image:
  repository: shaharc20
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5050

ingress:
  enabled: true
  className: nginx
  host: oneapp.local
  path: /

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

config:
  welcomeMessage: "ברוכים הבאים ל-oneapp! ההודעה הזו מגיעה מ-ConfigMap שמחובר כ-Volume לתוך ה-Pod."
